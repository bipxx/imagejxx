[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.4", "packaging==25.0", "pathspec==1.1.1", "tomli==2.2.1; python_version<'3.11'"]
build-backend = "scikit_build_core.build"

[project]
name = "imagejxx"
version = "0.2.0"
description = "Native C++ image editing and scientific processing with a NumPy interface"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
gui = [] # The optional native UI has no additional Python runtime dependencies.
io = ["Pillow==12.2.0", "tifffile==2024.12.12"]
test = ["pytest==8.4.2", "scipy==1.15.3", "packaging==25.0", "iniconfig==2.1.0", "pluggy==1.6.0", "Pygments==2.20.0", "colorama==0.4.6; sys_platform=='win32'", "tomli==2.2.1; python_version<'3.11'", "exceptiongroup==1.3.0; python_version<'3.11'", "typing-extensions==4.15.0; python_version<'3.11'"]
dev = ["Pillow==12.2.0", "tifffile==2024.12.12", "pytest==8.4.2", "scipy==1.15.3", "packaging==25.0", "pybind11==3.0.4", "scikit-build-core==0.11.6", "pathspec==1.1.1", "iniconfig==2.1.0", "pluggy==1.6.0", "Pygments==2.20.0", "colorama==0.4.6; sys_platform=='win32'", "tomli==2.2.1; python_version<'3.11'", "exceptiongroup==1.3.0; python_version<'3.11'", "typing-extensions==4.15.0; python_version<'3.11'"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["src/imagejxx"]
build-dir = "build/wheel/{wheel_tag}"
sdist.exclude = ["/imgui.ini", ".venv/**", ".cache/**", ".tools/**", "build/**", "dist/**", "**/__pycache__/**", ".pytest_cache/**", ".ruff_cache/**", ".tmp/**"]
sdist.include = ["/LICENSE", "/THIRD_PARTY_NOTICES.md", "/licenses/*.json", "/licenses/*.txt", "/third_party/nlohmann_json/**", "/third_party/zlib/**", "/third_party/imgui/**"]

[tool.scikit-build.cmake.define]
IMAGEJXX_BUILD_PYTHON = "ON"
IMAGEJXX_BUILD_PYTHON_UI = "OFF"
IMAGEJXX_BUILD_CPP_UI = "OFF"
BUILD_TESTING = "OFF"

[project.scripts]
imagejxx-ui = "imagejxx.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

