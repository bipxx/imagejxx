name: Test native and Python APIs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    name: Complete headless C++ and installed SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned source-policy checker dependency
        run: python -m pip install 'packaging==25.0'
      - name: Check source dependency licenses before native preparation
        run: python -I -B scripts/check_licenses.py
      - name: Check capture runner contracts
        shell: bash
        run: |
          python -I -B tests/tools/test_ci_observations.py
          python -I -B tests/tools/test_ci_current_observations.py
          python -I -B tests/tools/test_ci_python_suite.py
          python -I -B tests/tools/test_ci_reference_readiness.py
          python -I -B tests/tools/test_axis_reference_transport.py
          python -I -B tests/tools/test_z_projection_reference.py
          python -I -B tests/tools/test_rgb_projection_reference.py
          python -I -B scripts/generate_projection_numeric_fixture.py --check
          python -I -B scripts/generate_imagej_dataset_projection_fixture.py --check
          python -I -B tests/tools/test_ci_headless_origins.py
          python -I -B tests/tools/test_ci_headless_suite.py
          python -I -B tests/tools/test_ci_platform_dependencies.py
          python -I -B tests/tools/test_ci_platform_runtime.py
          python -I -B tests/tools/test_ci_png_binding.py
          python -I -B tests/tools/test_ci_platform_workflow.py
          python -I -B tests/tools/test_ci_history_build.py
          python -I -B tests/tools/test_ci_history_integration.py
          python -I -B tests/tools/test_floating_charconv_cmake.py
          python -I -B tests/tools/test_ci_python_diagnostics.py
          python -I -B tests/tools/test_ci_owned_process.py
          python -I -B tests/tools/test_capture_shortcuts_history_ui.py
          python -I -B tests/tools/test_capture_settings_drawing_ui.py
          python -I -B tests/tools/test_settings_drawing_reader.py
          python -I -B tests/tools/test_capture_history_owner_integration.py
          python -I -B tests/tools/test_ci_scientific_sdk.py
          python -I -B tests/tools/test_ci_windows_gl.py
          python -I -B tests/tools/test_ci_mac_process.py ProtocolMetadata PosixSocketTransport
      - name: Prove native macOS process ownership
        if: runner.os == 'macOS'
        run: python -I -B tests/tools/test_ci_mac_process.py --require-darwin
      - name: Build, test and install all headless C++ targets
        run: python scripts/ci_native.py --output build/ci-native
      - name: Retain native and SDK results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            build/ci-native/receipt.json
            build/ci-native/*.log
            build/ci-native/*.xml
          if-no-files-found: error
  linux-dependencies:
    name: Reviewed Linux scientific and desktop dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install platform build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Build the pinned source dependency prefix
        run: python scripts/ci_linux_dependencies.py --output build/ci-linux-dependencies
      - name: Publish dependency prefix with retained license notices
        uses: actions/upload-artifact@v4
        with:
          name: linux-scientific-desktop-prefix
          path: build/ci-linux-dependencies/prefix
          if-no-files-found: error
      - name: Retain dependency build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-dependency-build-evidence
          path: |
            build/ci-linux-dependencies/receipt.json
            build/ci-linux-dependencies/logs
          if-no-files-found: error
  linux-python:
    name: Complete Linux Python IO and ImGui (${{ matrix.python }})
    needs: linux-dependencies
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      # Preserve scikit-build-core's cache search paths for isolated pybind11.
      # CMake also searches this environment prefix for the reviewed libraries.
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/ci-prefix
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check original references before Linux product preparation
        run: python -I -B scripts/ci_python_suite.py --reference-readiness-only --output build/ci-reference-readiness
      - uses: actions/download-artifact@v4
        with:
          name: linux-scientific-desktop-prefix
          path: build/ci-prefix
      - name: Install platform development and rendering prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev xvfb xauth
      - name: Build and install Python IO and both desktop hosts
        run: >-
          python -I -B scripts/ci_history_build.py --output build/ci-history-build -- python -m pip install '.[io,test]'
          -Ccmake.define.IMAGEJXX_BUILD_IO=ON
          -Ccmake.define.IMAGEJXX_BUILD_CPP_UI=ON
          -Ccmake.define.IMAGEJXX_BUILD_PYTHON_UI=ON
          -Ccmake.define.BUILD_TESTING=ON
          -Ccmake.define.ZLIB_USE_STATIC_LIBS=ON
          -Ccmake.define.ZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/ci-prefix/lib/libz.a
          -Ccmake.define.PNG_LIBRARY_RELEASE=${{ github.workspace }}/build/ci-prefix/lib/libpng16.a
      - name: Check installed dependency inventory
        run: python scripts/check_licenses.py --installed --extras io,test --desktop
      - name: Run pipeline example
        run: python examples/pipeline.py
      - name: Qualify authenticated paired history UI under software OpenGL
        run: xvfb-run -a python -I -B scripts/ci_python_suite.py --history-suite --output build/ci-history --history-build-receipt build/ci-history-build/receipt.json
      - name: Qualify authenticated paired appearance UI under software OpenGL
        run: xvfb-run -a python -I -B scripts/ci_python_suite.py --appearance-suite --output build/ci-appearance --appearance-build-receipt build/ci-history-build/receipt.json
      - name: Test the complete installed Python suite under software OpenGL
        # This tool test invokes pytest against a synthetic project, without GL.
        # Product/render qualification still runs through the installed runner.
        run: |
          python -I -X utf8 -B tests/tools/test_ci_python_suite_transport.py
          xvfb-run -a python scripts/ci_python_suite.py --output build/ci-python --history-output build/ci-history --appearance-output build/ci-appearance
      - name: Retain complete Python results and fixture-contract inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-python-${{ matrix.python }}
          path: |
            build/ci-history-build/*.json
            build/ci-history-build/*.log
            build/ci-history/receipt.json
            build/ci-history/product-bindings.json
            build/ci-history/capture.zip
            build/ci-history/installed-smoke/*.json
            build/ci-history/installed-smoke/*.xml
            build/ci-history/installed-smoke/*.log
            build/ci-history/capture-owner/*
            build/ci-history/reader/*.json
            build/ci-history/reader/*.xml
            build/ci-history/reader/*.log
            build/ci-appearance/receipt.json
            build/ci-appearance/product-bindings.json
            build/ci-appearance/capture.zip
            build/ci-appearance/installed-smoke/*.json
            build/ci-appearance/installed-smoke/*.xml
            build/ci-appearance/installed-smoke/*.log
            build/ci-appearance/capture-owner/*
            build/ci-appearance/reader/*.json
            build/ci-appearance/reader/*.xml
            build/ci-appearance/reader/*.log
            build/ci-reference-readiness/reference-readiness.json
            build/ci-python/receipt.json
            build/ci-python/pytest.xml
            build/ci-python/pytest.log
            build/ci-python/process.json
            build/ci-python/*-python-diagnostics.zip
            build/ci-python/complete-collection.json
            build/ci-python/active-test.json
            build/ci-python/test-phases.jsonl
            build/ci-python/installed-smoke/receipt.json
            build/ci-python/installed-smoke/pytest.xml
            build/ci-python/installed-smoke/pytest.log
            build/ci-python/installed-smoke/process.json
            build/ci-python/current-observations/receipt.json
            build/ci-python/headless/receipt.json
            build/ci-python/headless.zip
            build/ci-python/current-observations.zip
            build/ci-python/cpp-observations/receipt.json
            build/ci-python/cpp-observations.zip
          if-no-files-found: warn
  windows-platform:
    name: Windows source profile
    uses: ./.github/workflows/source-platform.yml
    with:
      runner: windows-2022
      profile: windows-x64-ci-dynamic-source-001
  macos-arm64-platform:
    name: macOS arm64 source profile
    uses: ./.github/workflows/source-platform.yml
    with:
      runner: macos-latest
      profile: macos-arm64-ci-static-source-001
  macos-intel-platform:
    name: macOS Intel source profile
    uses: ./.github/workflows/source-platform.yml
    with:
      runner: macos-15-intel
      profile: macos-x86_64-ci-static-source-001
